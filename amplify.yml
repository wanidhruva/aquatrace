version: 1
frontend:
  phases:
    preBuild:
      commands:
        - cd frontend && (npm ci || npm install) && cd ..
        - cd site && (npm ci || npm install) && cd ..
    build:
      commands:
        - cd site && npm run build && cd ..
        - cd frontend && npm run build && cd ..
        - cp -r site/dist frontend/dist/site
  artifacts:
    baseDirectory: frontend/dist
    files:
      - '**/*'
  cache:
    paths:
      - frontend/node_modules/**/*
      - site/node_modules/**/*

